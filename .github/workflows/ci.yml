name: CI

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with redacted output
        run: >-
          docker run --rm
          --env GIT_CONFIG_COUNT=1
          --env GIT_CONFIG_KEY_0=safe.directory
          --env GIT_CONFIG_VALUE_0=/repo
          --mount type=bind,source=${{ github.workspace }},target=/repo,readonly
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --log-opts=--all --redact=100 --no-banner

  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.lock
            src/backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.lock
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --plan
      - run: python manage.py migrate --noinput
      - run: python manage.py migrate --check
      - run: python manage.py test
      - name: Django production deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-1234567890
          DATABASE_URL: postgresql://clinic:password@database.example.test:5432/clinic?sslmode=require
          REDIS_URL: redis://cache.example.test:6379/0
          ALLOWED_HOSTS: clinic.example.test
          CSRF_TRUSTED_ORIGINS: https://clinic.example.test
          FRONTEND_URL: https://clinic.example.test
          EMAIL_HOST: smtp.example.test
          EMAIL_PORT: '587'
          EMAIL_HOST_USER: ci@example.test
          EMAIL_HOST_PASSWORD: ci-only-password
          DEFAULT_FROM_EMAIL: no-reply@example.test
          AWS_STORAGE_BUCKET_NAME: clinic-public-ci
          AWS_PRIVATE_STORAGE_BUCKET_NAME: clinic-private-ci
          AWS_PUBLIC_MEDIA_PREFIX: public
          AWS_PRIVATE_MEDIA_PREFIX: private
          AWS_S3_REGION_NAME: us-east-1
          LOGIN_TRUSTED_PROXY_IPS: 10.0.0.10
        run: python manage.py check --deploy

  backend-postgres-appointments:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clinic_test
          POSTGRES_USER: clinic_test
          POSTGRES_PASSWORD: clinic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_test -d clinic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.postgres_test
      TEST_DATABASE_URL: postgresql://clinic_test:clinic-test-only@127.0.0.1:5432/clinic_test
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/backend/requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --plan
      - run: python manage.py migrate --noinput
      - run: python manage.py migrate --check
      - run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root production backend image
        run: docker build --tag dentalclinic-backend:ci src/backend
